<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Trợ lý chọn bánh · Sweet Bakery</title>
  <link rel="stylesheet" href="/static/style.css?v=6fbc0bed8ef2">
  <script src="/static/chat.js?v=94b5ddd15097" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/website/">Sweet Bakery<span>BAKED WITH LOVE</span></a>
      <nav aria-label="Điều hướng">
        <a href="/website/">Về trang chủ</a>
        <a class="menu-link" href="/website/banh-kem-p1.html">Xem menu <span aria-hidden="true">→</span></a>
      </nav>
    </div>
  </header>
  <main class="workspace">
    <section class="chat-panel" aria-labelledby="chat-title">
      <header class="chat-header">
        <div><h1 id="chat-title">Trợ lý Sweet Bakery</h1><p id="connection-status" role="status">Đang kết nối…</p></div>
        <button id="new-conversation" class="button secondary" type="button" aria-label="Bắt đầu hội thoại mới">Chat mới</button>
      </header>
      <div class="mode-line">
        <span id="mode-label" class="badge">Đang kết nối</span>
        <p id="data-notice">Đang kiểm tra menu.</p>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Tin nhắn">
        <section id="welcome" class="welcome">
          <h2>Bạn muốn tìm bánh gì?</h2>
          <p>Hỏi giá, chọn bánh theo ngân sách hoặc ghi nhận nhu cầu của bạn.</p>
          <div class="quick-actions" aria-label="Gợi ý bắt đầu">
            <button type="button" data-message="Cho tôi xem các loại bánh">Xem các loại bánh</button>
            <button type="button" data-message="Tìm bánh dưới 300k">Tìm bánh dưới 300k</button>
          </div>
        </section>
      </div>
      <div id="review-panel" class="review-panel" hidden></div>
      <p id="error-message" class="error" role="alert" hidden></p>
      <div class="composer">
        <form id="chat-form">
          <label class="sr-only" for="message-input">Tin nhắn của bạn</label>
          <textarea id="message-input" rows="1" maxlength="2000" placeholder="Nhập câu hỏi của bạn…" required></textarea>
          <button id="send-button" class="button primary" type="submit">Gửi <span aria-hidden="true">→</span></button>
        </form>
        <div class="input-hint"><span>Enter để gửi · Shift + Enter để xuống dòng</span><span id="char-count" hidden></span></div>
      </div>
    </section>
  </main>
</body>
</html>
