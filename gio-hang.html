<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Sweet Bakery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="top-bar">
            <div class="container top-bar-inner">
                <span><i class="fas fa-phone-alt"></i> Hotline: 1900 1234</span>
                <span><i class="fas fa-map-marker-alt"></i> Hệ thống cửa hàng</span>
            </div>
        </div>
        <div class="main-nav">
            <div class="container nav-inner">
                <div class="logo"><h2>Sweet Bakery</h2></div>
                <nav class="menu">
                    <a href="index.html">Trang chủ</a>
                    <a href="banh-kem-p1.html">Bánh Kem</a>
                    <a href="do-uong-p1.html">Trà & Cà Phê</a>
                    <a href="banh-mini-p1.html">Bánh Ngọt Nhỏ</a>
                </nav>
                <div class="header-icons">
                    <i class="fas fa-search"></i>
                    <i class="fas fa-user"></i>
                    <!-- Sửa lại chỗ này: Bọc thẻ <a> để click chuyển sang trang giỏ hàng -->
                    <a href="gio-hang.html" style="color: inherit; text-decoration: none;">
                        <div class="cart-icon">
                            <i class="fas fa-shopping-bag"></i><span class="cart-count">0</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container cart-page">
        <!-- ĐIỀU HƯỚNG BREADCRUMB -->
        <div class="breadcrumb">
            <a href="index.html">Trang chủ</a> <span>/</span> <strong>Giỏ hàng</strong>
        </div>

        <h1 class="cart-title">Giỏ hàng của bạn</h1>
        
        <div class="cart-container">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>

            <div class="cart-summary-box">
                <h3>Tổng thanh toán: <span class="final-total">320.000 ₫</span></h3>
                <button class="btn-checkout">TIẾN HÀNH THANH TOÁN</button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Sweet Bakery - Xây dựng bởi Nhóm 6.</p>
        </div>
    </footer>
    
    <!-- Nhúng file JS -->
    <script src="script.js"></script>
</body>
</html>
